name: CI

on:
  push:
    branches: [main, cadastra-vision-build]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies (CPU build of PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements-dev.txt
      # The trained checkpoint and the survey layers are not stored in git.
      # Tests that need the checkpoint are skipped; the model architecture is
      # still checked against the checkpoint's tensor manifest.
      - name: Run tests
        run: python -m pytest backend/tests -ra --junitxml=pytest-report.xml
      # Job logs need a sign-in; annotations are public, so failures are
      # repeated there with their message.
      - name: Report the counts, and failing tests, as annotations
        if: always()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suite = ET.parse("pytest-report.xml").getroot()
          suite = suite if suite.tag == "testsuite" else suite.find("testsuite")
          total, skipped = int(suite.get("tests")), int(suite.get("skipped"))
          failed = int(suite.get("failures")) + int(suite.get("errors"))
          print(f"::notice title=Backend tests (${{ matrix.os }})::{total} tests: "
                f"{total - skipped - failed} passed, {skipped} skipped, {failed} failed")
          from collections import Counter
          reasons = Counter(s.get("message", "") for s in suite.iter("skipped"))
          for reason, count in reasons.items():
              print(f"::notice title=Skipped ({count})::{reason[:300]}")
          for case in ET.parse("pytest-report.xml").iter("testcase"):
              for bad in list(case.findall("failure")) + list(case.findall("error")):
                  text = (bad.get("message", "") + "\n" + (bad.text or ""))[-1800:]
                  text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                  print(f"::error title={case.get('classname')}.{case.get('name')}::{text}")
          PY
      - name: API starts
        env:
          CADASTRA_AUTH: "off"
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from backend.main import app
          with TestClient(app) as client:
              assert client.get("/health").json()["status"] == "ok"
              assert client.get("/api/system/status").status_code == 200
          print("API started and answered /health")
          PY

  frontend:
    name: Frontend build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The README's Quick start, run as written on a clean macOS and Linux
  # machine (system python3, no setup-python). The checkpoint is not in
  # git, so selfcheck reports it missing; the server must still start.
  readme-setup:
    name: README setup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Backend, as in the README
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt
          # Not a README step: fails if PyTorch and torchvision do not match.
          python -c "import torch, segmentation_models_pytorch; print('model libraries import')"
          cp backend/.env.example backend/.env
          python -m backend.scripts.selfcheck || echo "selfcheck exited $? (expected: no checkpoint in CI)"
          uvicorn backend.main:app --port 8000 &
          for i in $(seq 1 60); do curl -sf http://localhost:8000/health && break; sleep 2; done
          curl -sf http://localhost:8000/health
      - name: Frontend, as in the README
        run: |
          cd frontend
          npm install
          cp .env.example .env
          npm run build
