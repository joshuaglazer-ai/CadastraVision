name: CI

on:
  push:
    branches: [main, cadastra-vision-build]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies (CPU build of PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements-dev.txt
      # The trained checkpoint and the survey layers are not stored in git.
      # Tests that need the checkpoint are skipped; the model architecture is
      # still checked against the checkpoint's tensor manifest.
      - name: Run tests
        run: python -m pytest backend/tests -ra
      - name: API starts
        env:
          CADASTRA_AUTH: "off"
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from backend.main import app
          with TestClient(app) as client:
              assert client.get("/health").json()["status"] == "ok"
              assert client.get("/api/system/status").status_code == 200
          print("API started and answered /health")
          PY

  frontend:
    name: Frontend build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build
