name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install model stack
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install segmentation-models-pytorch numpy
      - name: Compare model definition with the trained checkpoint manifest
        run: |
          python - <<'PY'
          import json, torch, segmentation_models_pytorch as smp
          print("torch", torch.__version__, "smp", smp.__version__)
          model = smp.Unet(encoder_name="resnet34", encoder_weights=None, in_channels=3, classes=6)
          sd = model.state_dict()
          man = json.load(open("backend/tests/fixtures/checkpoint_manifest.json"))["tensors"]
          missing = sorted(set(sd) - set(man)); unexpected = sorted(set(man) - set(sd))
          shape = [k for k in sd if k in man and list(sd[k].shape) != man[k]["shape"]]
          print("model tensors", len(sd), "checkpoint tensors", len(man))
          print("missing_in_checkpoint", missing[:10]); print("unexpected_in_checkpoint", unexpected[:10]); print("shape_mismatch", shape[:10])
          assert not missing and not unexpected and not shape
          x = torch.zeros(1, 3, 512, 512)
          model.eval()
          with torch.no_grad():
              y = model(x)
          print("output shape", tuple(y.shape))
          assert tuple(y.shape) == (1, 6, 512, 512)
          print("RESULT: MATCH")
          PY
